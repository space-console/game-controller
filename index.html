<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Phone-first: device width, locked zoom, no callout. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05060f" />
  <title>Space Console Controller</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <!-- Reconnect banner: shown while a dropped session is rejoining (e.g. after
       the tab was backgrounded). Fixed to the top so it's visible over the pad. -->
  <div class="reconnect" id="reconnectBanner" role="status" aria-live="assertive" hidden>
    <span class="reconnect__dot"></span>
    <span>Reconnecting…</span>
  </div>

  <div class="app" id="app">
    <!-- Join screen: enter the room code shown on the TV. -->
    <section class="join" id="join">
      <h1 class="join__brand">Space&nbsp;Console</h1>
      <p class="join__hint">Enter the code shown on the TV</p>
      <form class="join__form" id="joinForm">
        <input
          class="join__name"
          id="nameInput"
          inputmode="text"
          autocomplete="off"
          autocapitalize="words"
          maxlength="12"
          placeholder="Your name"
          aria-label="Your name"
        />
        <input
          class="join__code"
          id="codeInput"
          inputmode="text"
          autocomplete="off"
          autocapitalize="characters"
          maxlength="4"
          placeholder="····"
          aria-label="Room code"
        />
        <button class="join__btn" type="submit">Connect</button>
      </form>
      <p class="join__status" id="joinStatus" aria-live="polite"></p>
    </section>

    <!-- Control surface: revealed once "connected" (stubbed transport). -->
    <section class="pad" id="pad" hidden>
      <header class="pad__bar">
        <span class="pad__room" id="padRoom"></span>
        <button class="pad__leave" id="leaveBtn" type="button">Leave</button>
      </header>

      <p class="pad__log" id="padLog" aria-live="polite"></p>

      <!-- Controls sit in the bottom thumb-zone (see .pad__controls). -->
      <div class="pad__controls">
        <div class="pad__dpad" id="padDpad" role="group" aria-label="Direction pad">
          <button class="dpad dpad--up"    data-intent="up"    aria-label="Up">▲</button>
          <button class="dpad dpad--left"  data-intent="left"  aria-label="Left">◀</button>
          <button class="dpad dpad--right" data-intent="right" aria-label="Right">▶</button>
          <button class="dpad dpad--down"  data-intent="down"  aria-label="Down">▼</button>
        </div>

        <!-- Action buttons are rendered by app.js from the layout the TV sends. -->
        <div class="pad__actions" id="padActions" role="group" aria-label="Action buttons"></div>
      </div>
    </section>
  </div>

  <script type="module" src="./assets/js/app.js?v=d04bfd23-052f-46e8-b63b-50418e9611eb"></script>
</body>
</html>
